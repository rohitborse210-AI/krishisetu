services:
  - type: web
    name: krishisetu-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && alembic -c backend/alembic.ini upgrade head && python -m backend.seed
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krishisetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BOOKING_CONFIRMATION_HOURS
        value: "24"

databases:
  - name: krishisetu-db
    databaseName: krishisetu_db
    user: krishisetu_user
    plan: free
